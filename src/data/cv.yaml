site:
  title: İsmail Güderer
  description: PhD Candidate in Bioinformatics at the Leibniz Institute on Aging (FLI), Jena. I study how the gut microbiome influences aging in the African turquoise killifish.

person:
  name: İsmail Güderer
  # author-list spellings that are bolded
  authorName: [Güderer İ]
  role: PhD Candidate
  affiliation: Dönertaş Group, Leibniz Institute on Aging (FLI)
  affiliationUrl: https://www.leibniz-fli.de/
  location: Jena, Germany
  statement: I study how organisms age, reading it one long molecule at a time.
  about:
    - I am a PhD candidate in bioinformatics in the Dönertaş Group at the Leibniz Institute on Aging, Fritz Lipmann Institute (FLI), in Jena. In my thesis, I combine Nanopore long-read sequencing, single-cell transcriptomics, and metagenomics to ask how the gut microbiome influences aging in the African turquoise killifish (Nothobranchius furzeri).
    - Before joining FLI, I spent seven years at Middle East Technical University (METU) in Ankara, where I studied aldo-keto reductases in colorectal cancer by in vitro and in silico methods. As a research assistant, I also coordinated two student laboratory courses; taught cell biology, genetics, epigenetics, and evolution; and ran the department's IT services, including its website.
